[project]
name = "robolab"
version = "1.0.dev4"
description = "Image classification with ConvNet model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.20",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.setuptools.packages.find]
include = ["robolab*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[dependency-groups]
dev = ["pre-commit>=4.6.0"]
